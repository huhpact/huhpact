<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Länder-Quiz – Setup</title>
    <link rel="stylesheet" href="/quiz/style.css">
     <link rel="icon" type="image/png" href="/quiz/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/quiz/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/quiz/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/quiz/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Quizzy" />
    <link rel="manifest" href="/quiz/favicon/site.webmanifest" />
</head>
<body>
    <div class="container">
        <header class="quiz-header">
            <button class="back-btn" onclick="window.location.href='/quiz/index.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back
            </button>
            <h1 class="neon-text">Länder-Quiz</h1>
        </header>
        <main class="setup-container">
            <div class="setup-card">
                <div class="setup-section">
                    <h2>Anzahl der Fragen</h2>
                    <div class="options-grid">
                        <button class="option-btn active" data-questions="10">10</button>
                        <button class="option-btn" data-questions="20">20</button>
                        <button class="option-btn" data-questions="30">30</button>
                        <button class="option-btn" data-questions="50">50</button>
                    </div>
                </div>
                <div class="setup-section">
                    <h2>Region</h2>
                    <div class="options-grid">
                        <button class="option-btn active" data-region="all">Weltweit</button>
                        <button class="option-btn" data-region="Europe">Europa</button>
                        <button class="option-btn" data-region="Africa">Afrika</button>
                        <button class="option-btn" data-region="Asia">Asien</button>
                        <button class="option-btn" data-region="Americas">Amerika</button>
                        <button class="option-btn" data-region="Oceania">Ozeanien</button>
                    </div>
                </div>
                <button class="start-btn" onclick="startQuiz()">
                    Quiz starten
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
            </div>
        </main>
    </div>
    <script>
        var selectedQuestions = 10;
        var selectedRegion = 'all';

        document.querySelectorAll('.option-btn[data-questions]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.option-btn[data-questions]').forEach(function(b){ b.classList.remove('active'); });
                btn.classList.add('active');
                selectedQuestions = parseInt(btn.dataset.questions);
            });
        });

        document.querySelectorAll('.option-btn[data-region]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.option-btn[data-region]').forEach(function(b){ b.classList.remove('active'); });
                btn.classList.add('active');
                selectedRegion = btn.dataset.region;
            });
        });

        function startQuiz() {
            sessionStorage.setItem('countryClickQuestions', selectedQuestions);
            sessionStorage.setItem('countryClickRegion', selectedRegion);
            window.location.href = 'country-click-quiz.html';
        }
    </script>
</body>
</html>
