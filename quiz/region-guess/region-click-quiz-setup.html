<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regionen-Quiz – Setup</title>
    <link rel="stylesheet" href="/quiz/style.css">
     <link rel="icon" type="image/png" href="/quiz/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/quiz/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/quiz/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/quiz/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Quizzy" />
    <link rel="manifest" href="/quiz/favicon/site.webmanifest" />
    <style>
        /* Country <select> styled to match the existing option-btn look-and-feel */
        .country-select-wrap {
            position: relative;
        }

        .country-select {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            background: var(--bg-card);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.85rem 2.6rem 0.85rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .country-select:hover {
            border-color: var(--accent);
        }

        .country-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .country-select-wrap::after {
            content: "";
            position: absolute;
            right: 1rem;
            top: 50%;
            width: 10px;
            height: 10px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            transform: translateY(-70%) rotate(45deg);
            pointer-events: none;
        }

        .region-count-hint {
            margin-top: 0.55rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="quiz-header">
            <button class="back-btn" onclick="window.location.href='/quiz/index.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back
            </button>
            <h1 class="neon-text">Regionen-Quiz</h1>
        </header>
        <main class="setup-container">
            <div class="setup-card">
                <div class="setup-section">
                    <h2>Anzahl der Fragen</h2>
                    <div class="options-grid">
                        <button class="option-btn active" data-questions="10">10</button>
                        <button class="option-btn" data-questions="20">20</button>
                        <button class="option-btn" data-questions="30">30</button>
                        <button class="option-btn" data-questions="50">50</button>
                    </div>
                </div>
                <div class="setup-section">
                    <h2>Land</h2>
                    <div class="country-select-wrap">
                        <select class="country-select" id="country-select">
                            <option value="all">Ganz Europa</option>
                        </select>
                    </div>
                    <p class="region-count-hint" id="region-count-hint"></p>
                </div>
                <button class="start-btn" onclick="startQuiz()">
                    Quiz starten
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
            </div>
        </main>
    </div>
    <script src="country-names-de-regions.js"></script>
    <script>
        var selectedQuestions = 10;
        var selectedCountry = 'all';
        var regionCounts = {}; // country key -> number of regions, filled once geojson loads

        document.querySelectorAll('.option-btn[data-questions]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.option-btn[data-questions]').forEach(function(b){ b.classList.remove('active'); });
                btn.classList.add('active');
                selectedQuestions = parseInt(btn.dataset.questions);
                updateHint();
            });
        });

        // Populate the country dropdown, sorted alphabetically by German name
        var countrySelect = document.getElementById('country-select');
        var countryKeys = Object.keys(countryNamesDEForRegions).sort(function(a, b) {
            return countryNamesDEForRegions[a].localeCompare(countryNamesDEForRegions[b], 'de');
        });
        countryKeys.forEach(function(key) {
            var opt = document.createElement('option');
            opt.value = key;
            opt.textContent = countryNamesDEForRegions[key];
            countrySelect.appendChild(opt);
        });

        countrySelect.addEventListener('change', function() {
            selectedCountry = countrySelect.value;
            updateHint();
        });

        function updateHint() {
            var hint = document.getElementById('region-count-hint');
            if (Object.keys(regionCounts).length === 0) {
                hint.textContent = '';
                return;
            }
            var available = selectedCountry === 'all'
                ? Object.values(regionCounts).reduce(function(a, b) { return a + b; }, 0)
                : (regionCounts[selectedCountry] || 0);
            hint.textContent = available + ' Region' + (available === 1 ? '' : 'en') + ' verfügbar · ' +
                selectedQuestions + ' Frage' + (selectedQuestions === 1 ? '' : 'n') +
                (available < selectedQuestions ? ' (manche wiederholen sich)' : '');
        }

        // Fetch the geojson once just to compute per-country region counts for the hint text.
        // This is a nice-to-have; if it fails, the setup still works fine without the hint.
        fetch('europe-regions.geojson')
            .then(function(res) { return res.json(); })
            .then(function(geojson) {
                geojson.features.forEach(function(f) {
                    var c = f.properties.country;
                    regionCounts[c] = (regionCounts[c] || 0) + 1;
                });
                updateHint();
            })
            .catch(function(err) {
                console.warn('Konnte Regionenzahl nicht laden:', err);
            });

        function startQuiz() {
            sessionStorage.setItem('regionClickQuestions', selectedQuestions);
            sessionStorage.setItem('regionClickCountry', selectedCountry);
            window.location.href = 'region-click-quiz.html';
        }
    </script>
</body>
</html>
