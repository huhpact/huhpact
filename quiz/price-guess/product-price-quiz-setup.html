<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt-Preise Quiz – Setup</title>
    <link rel="stylesheet" href="/quiz/style.css">
    <link rel="icon" type="image/png" href="/quiz/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/quiz/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/quiz/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/quiz/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Quizzy" />
    <link rel="manifest" href="/quiz/favicon/site.webmanifest" />
</head>
<body>
    <div class="container">
        <header class="quiz-header">
            <button class="back-btn" onclick="window.location.href='/quiz/index.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back
            </button>
            <h1 class="neon-text">Produkt-Preise</h1>
        </header>
        <main class="setup-container">
            <div class="setup-card">
                <div class="setup-section">
                    <h2>Anzahl der Fragen</h2>
                    <div class="options-grid" id="grid-questions">
                        <button class="option-btn active" data-value="10">10</button>
                        <button class="option-btn" data-value="20">20</button>
                        <button class="option-btn" data-value="30">30</button>
                        <button class="option-btn" data-value="50">50</button>
                    </div>
                </div>
                <div class="setup-section">
                    <h2>Zustand</h2>
                    <div class="options-grid" id="grid-condition">
                        <button class="option-btn active" data-value="alle">Alle</button>
                        <button class="option-btn" data-value="neu">Neu</button>
                        <button class="option-btn" data-value="gebraucht">Gebraucht</button>
                    </div>
                </div>
                <button class="start-btn" onclick="startQuiz()">
                    Quiz starten
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
            </div>
        </main>
    </div>
    <script>
        var selected = { questions: '10', condition: 'alle' };

        function bindGrid(id, key) {
            document.querySelectorAll('#' + id + ' .option-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('#' + id + ' .option-btn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    selected[key] = btn.dataset.value;
                });
            });
        }
        bindGrid('grid-questions', 'questions');
        bindGrid('grid-condition', 'condition');

        function startQuiz() {
            sessionStorage.setItem('productPricesQuestions', selected.questions);
            sessionStorage.setItem('productPricesCondition', selected.condition);
            window.location.href = 'product-price-quiz.html';
        }
    </script>
</body>
</html>
