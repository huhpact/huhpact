<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt-Preise Quiz</title>
    <link rel="stylesheet" href="/quiz/style.css">
    <link rel="icon" type="image/png" href="/quiz/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/quiz/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/quiz/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/quiz/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Quizzy" />
    <link rel="manifest" href="/quiz/favicon/site.webmanifest" />
    <style>
        .product-title { font-size: 1.35rem; font-weight: 800; color: var(--text); text-align: center; line-height: 1.25; margin-bottom: 1rem; }
        .product-stage { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-xl); padding: 1.75rem; margin-bottom: 1.75rem; box-shadow: var(--shadow-md); }
        .product-body { display: flex; gap: 1.75rem; align-items: stretch; }
        .product-image-col { flex: 1 1 50%; min-width: 0; border-radius: var(--radius-md); overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; }
        .product-image-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; animation: pIn 0.38s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
        @keyframes pIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .product-image { width: 100%; height: 100%; min-height: 240px; max-height: 340px; object-fit: contain; display: block; padding: 0.75rem; }
        .product-error-msg { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.8rem; color: var(--text-muted); padding: 1.5rem; min-height: 240px; }
        .product-data-col { flex: 1 1 50%; display: flex; flex-direction: column; justify-content: center; gap: 0.8rem; min-width: 0; }
        .p-stat { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.7rem 0.9rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); }
        .p-stat-label-group { display: flex; align-items: center; gap: 0.55rem; }
        .p-stat-icon { width: 18px; height: 18px; flex-shrink: 0; color: var(--accent); }
        .p-stat-label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
        .p-stat-value { font-size: 1.02rem; font-weight: 800; color: var(--text); text-align: right; }
        .cond-badge { display: inline-block; padding: 0.15rem 0.7rem; border-radius: 999px; font-size: 0.85rem; font-weight: 800; }
        .cond-badge.neu { background: rgba(34,197,94,0.15); color: #22c55e; }
        .cond-badge.gebraucht { background: rgba(245,158,11,0.15); color: #f59e0b; }

        .input-area { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; }
        .guess-display { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
        .guess-label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
        .guess-value { font-size: 2rem; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; transition: color 0.15s; }
        .guess-value.correct { color: #22c55e; }
        .guess-value.incorrect { color: #ef4444; }
        .slider-row { display: flex; flex-direction: column; gap: 0.4rem; width: 100%; }
        .price-track-wrap { position: relative; width: 100%; }
        .price-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px; background: var(--border); outline: none; cursor: pointer; }
        .price-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg-card); box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.1s; }
        .price-slider::-webkit-slider-thumb:active { transform: scale(1.12); }
        .price-slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg-card); box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer; }
        .price-slider:disabled { cursor: default; opacity: 0.7; }
        .slider-bounds { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .actual-marker { position: absolute; top: -0.55rem; width: 2px; height: 20px; background: #22c55e; transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .actual-marker.shown { opacity: 1; }
        .actual-marker::after { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid #22c55e; }
        .submit-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-md); padding: 0.9rem 1.4rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s, transform 0.1s; font-family: inherit; width: 100%; }
        .submit-btn:hover { opacity: 0.88; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.5; cursor: default; }
        .feedback-row { min-height: 1.6rem; display: flex; align-items: center; justify-content: center; font-size: 0.88rem; font-weight: 600; text-align: center; }
        .feedback-row.correct { color: #22c55e; }
        .feedback-row.incorrect { color: #ef4444; }
        .feedback-row.hidden { opacity: 0; }
        @media (max-width: 640px) {
            .product-body { flex-direction: column; }
            .product-image { min-height: 200px; }
            .product-title { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-top-bar">
            <div class="score-display">
                <span class="score-label">Score:</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="progress-display">
                <span id="current-question">1</span> / <span id="total-questions">10</span>
            </div>
        </div>

        <main class="quiz-container">
            <div class="product-stage">
                <h2 class="product-title" id="product-name"></h2>
                <div class="product-body">
                    <div class="product-image-col" id="product-render"></div>
                    <div class="product-data-col">
                        <div class="p-stat">
                            <span class="p-stat-label-group">
                                <svg class="p-stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                                <span class="p-stat-label">Kategorie</span>
                            </span>
                            <span class="p-stat-value" id="product-category"></span>
                        </div>
                        <div class="p-stat">
                            <span class="p-stat-label-group">
                                <svg class="p-stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                <span class="p-stat-label">Zustand</span>
                            </span>
                            <span class="p-stat-value"><span class="cond-badge" id="product-condition"></span></span>
                        </div>
                        <div class="p-stat">
                            <span class="p-stat-label-group">
                                <svg class="p-stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                <span class="p-stat-label">Veröffentlicht</span>
                            </span>
                            <span class="p-stat-value" id="product-release"></span>
                        </div>
                        <div class="p-stat">
                            <span class="p-stat-label-group">
                                <svg class="p-stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                                <span class="p-stat-label">Hersteller</span>
                            </span>
                            <span class="p-stat-value" id="product-brand"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="guess-display">
                    <span class="guess-label">Dein Tipp</span>
                    <span class="guess-value" id="guess-value">0 €</span>
                </div>
                <div class="slider-row">
                    <div class="price-track-wrap">
                        <input type="range" class="price-slider" id="price-slider" min="0" max="1000" step="1" value="0" />
                        <div class="actual-marker" id="actual-marker"></div>
                    </div>
                    <div class="slider-bounds">
                        <span id="slider-min-label">0 €</span>
                        <span id="slider-max-label">1.000 €</span>
                    </div>
                </div>
                <button class="submit-btn" id="submit-btn">Prüfen</button>
                <div class="feedback-row hidden" id="feedback-row"></div>
            </div>
        </main>
    </div>

    <div id="results-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="neon-text">Quiz beendet!</h2>
            <div class="results-stats">
                <div class="stat-item"><span class="stat-value" id="final-score">0</span><span class="stat-label">Richtig</span></div>
                <div class="stat-item"><span class="stat-value" id="final-total">10</span><span class="stat-label">Gesamt</span></div>
                <div class="stat-item"><span class="stat-value" id="final-percentage">0%</span><span class="stat-label">Genauigkeit</span></div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="window.location.href='product-price-quiz-setup.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    Nochmal
                </button>
                <button class="modal-btn secondary" onclick="window.location.href='/quiz/index.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Zur Startseite
                </button>
            </div>
        </div>
    </div>

    <script src="product-prices.js"></script>
    <script>
        var questions = [], current = 0, score = 0, answered = false;
        var advanceTimer = null, countInterval = null;
        var rangeMin = 0, rangeMax = 1000, tolerance = 0;
        var MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

        document.addEventListener('DOMContentLoaded', function () {
            var total = parseInt(sessionStorage.getItem('productPricesQuestions')) || 10;
            var cond  = sessionStorage.getItem('productPricesCondition') || 'alle';

            var pool = productPrices.filter(function (p) { return cond === 'alle' || p.condition === cond; });
            if (pool.length < 1) {
                alert('Keine Produkte in der Datenbank.');
                window.location.href = 'product-price-quiz-setup.html';
                return;
            }
            for (var i = pool.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
            }
            // Pool wird wiederholt, falls weniger Produkte als Fragen vorhanden sind
            while (questions.length < total) { questions = questions.concat(pool); }
            questions = questions.slice(0, total);
            document.getElementById('total-questions').textContent = questions.length;

            document.getElementById('submit-btn').addEventListener('click', submitAnswer);
            document.getElementById('price-slider').addEventListener('input', updateGuessDisplay);
            loadQuestion();
        });

        function formatRelease(r) {
            var p = r.split('-');
            return p.length === 2 ? MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0] : p[0];
        }

        function loadQuestion() {
            if (current >= questions.length) { showResults(); return; }
            answered = false;
            clearTimers();

            var q = questions[current];
            document.getElementById('current-question').textContent = current + 1;

            var render = document.getElementById('product-render');
            render.innerHTML = '';
            var wrapper = document.createElement('div');
            wrapper.className = 'product-image-wrapper';
            var imgEl = document.createElement('img');
            imgEl.className = 'product-image';
            imgEl.alt = q.name;
            imgEl.onerror = function () {
                imgEl.onerror = null;
                imgEl.style.display = 'none';
                var err = document.createElement('div');
                err.className = 'product-error-msg';
                err.textContent = '⚠ Bild nicht gefunden: ' + q.image;
                wrapper.appendChild(err);
            };
            imgEl.src = q.image;
            wrapper.appendChild(imgEl);
            render.appendChild(wrapper);

            document.getElementById('product-name').textContent     = q.name;
            document.getElementById('product-category').textContent = q.category;
            document.getElementById('product-release').textContent  = formatRelease(q.release);
            document.getElementById('product-brand').textContent    = q.brand;
            var cb = document.getElementById('product-condition');
            cb.textContent = q.condition === 'neu' ? 'Neu' : 'Gebraucht';
            cb.className   = 'cond-badge ' + q.condition;

            var range = computeRange(q.price);
            rangeMin = range.min; rangeMax = range.max;
            tolerance = computeTolerance(q.price);

            var slider = document.getElementById('price-slider');
            slider.min = rangeMin; slider.max = rangeMax; slider.step = range.step;
            // Zufälliger Startwert, damit der Startpunkt keinen Hinweis auf den Preis gibt
            var steps = Math.round((rangeMax - rangeMin) / range.step);
            slider.value = rangeMin + Math.floor(Math.random() * (steps + 1)) * range.step;
            slider.disabled = false;

            document.getElementById('slider-min-label').textContent = formatCurrency(rangeMin);
            document.getElementById('slider-max-label').textContent = formatCurrency(rangeMax);
            document.getElementById('actual-marker').classList.remove('shown');
            updateGuessDisplay();

            var btn = document.getElementById('submit-btn');
            btn.disabled = false; btn.textContent = 'Prüfen';
            var fb = document.getElementById('feedback-row');
            fb.textContent = ''; fb.className = 'feedback-row hidden';
            document.getElementById('guess-value').className = 'guess-value';
        }

        // Dynamischer Slider-Bereich um den echten Preis. Breite und Position sind zwei
        // unabhängige, additive Zufallswerte, damit der Preis nicht systematisch auf einer
        // Seite des Sliders landet.
        function computeRange(price) {
            var width = price * (1.6 + Math.random() * 1.6);
            var pos   = 0.12 + Math.random() * 0.73;
            var rawMin = price - width * pos;
            var rawMax = rawMin + width;

            var step;
            if (price < 50)           step = 1;
            else if (price < 200)     step = 5;
            else if (price < 1000)    step = 10;
            else if (price < 5000)    step = 50;
            else if (price < 20000)   step = 100;
            else if (price < 60000)   step = 250;
            else if (price < 150000)  step = 500;
            else if (price < 500000)  step = 1000;
            else                      step = 5000;

            var min = Math.max(0, Math.floor(rawMin / step) * step);
            var max = Math.ceil(rawMax / step) * step;
            var minWidth = Math.max(step * 20, price * 0.5);
            if (max - min < minWidth) max = Math.ceil((min + minWidth) / step) * step;
            return { min: min, max: max, step: step };
        }

        // 12 % Toleranz, bei günstigen Produkten mit sinnvollem Mindestbetrag
        function computeTolerance(price) {
            var minAbs = price < 100 ? 3 : (price < 1000 ? 20 : 100);
            return Math.max(price * 0.12, minAbs);
        }

        function updateGuessDisplay() {
            document.getElementById('guess-value').textContent =
                formatCurrency(parseInt(document.getElementById('price-slider').value, 10));
        }

        function submitAnswer() {
            if (answered) { advance(); return; }
            answered = true;

            var slider = document.getElementById('price-slider');
            slider.disabled = true;

            var q = questions[current];
            var guess = parseInt(slider.value, 10);
            var isRight = Math.abs(guess - q.price) <= tolerance;
            var guessEl = document.getElementById('guess-value');
            var fb = document.getElementById('feedback-row');

            var marker = document.getElementById('actual-marker');
            var pct = Math.min(1, Math.max(0, (q.price - rangeMin) / (rangeMax - rangeMin)));
            marker.style.left = (pct * 100) + '%';
            marker.classList.add('shown');

            var abw = Math.round(Math.abs(guess - q.price) / q.price * 100);
            if (isRight) {
                score++;
                document.getElementById('score').textContent = score;
                guessEl.className = 'guess-value correct';
                fb.textContent = '✓ Sehr gut! Tatsächlicher Preis: ' + formatCurrency(q.price) + ' (' + abw + ' % daneben)';
                fb.className = 'feedback-row correct';
            } else {
                guessEl.className = 'guess-value incorrect';
                fb.textContent = '✗ ' + (guess < q.price ? 'zu niedrig' : 'zu hoch') + ' — tatsächlicher Preis: ' + formatCurrency(q.price) + ' (' + abw + ' % daneben)';
                fb.className = 'feedback-row incorrect';
            }

            var btn = document.getElementById('submit-btn');
            var remaining = 3;
            btn.textContent = 'Weiter (' + remaining + ')';
            countInterval = setInterval(function () {
                remaining--;
                if (remaining > 0) btn.textContent = 'Weiter (' + remaining + ')';
                else { clearInterval(countInterval); countInterval = null; }
            }, 1000);
            advanceTimer = setTimeout(advance, 3000);
        }

        function clearTimers() {
            if (advanceTimer !== null)  { clearTimeout(advanceTimer);   advanceTimer = null; }
            if (countInterval !== null) { clearInterval(countInterval); countInterval = null; }
        }

        function advance() { clearTimers(); current++; loadQuestion(); }

        function showResults() {
            document.getElementById('final-score').textContent      = score;
            document.getElementById('final-total').textContent      = questions.length;
            document.getElementById('final-percentage').textContent = Math.round(score / questions.length * 100) + '%';
            document.getElementById('results-modal').classList.remove('hidden');
        }

        function formatCurrency(n) { return n.toLocaleString('de-DE') + ' €'; }
    </script>
</body>
</html>
