<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kennzeichen-Quiz – Einfach – Setup</title>
    <link rel="stylesheet" href="/quiz/style.css">
     <link rel="icon" type="image/png" href="/quiz/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/quiz/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/quiz/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/quiz/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Quizzy" />
    <link rel="manifest" href="/quiz/favicon/site.webmanifest" />
    <style>
        .region-count-hint {
            margin-top: 0.55rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
        }

        .country-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        .country-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--bg-card);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }

        .country-btn .flag {
            font-size: 1.15rem;
            line-height: 1;
        }

        .country-btn:hover {
            border-color: var(--accent);
        }

        .country-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .country-hint {
            margin-top: 0.55rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="quiz-header">
            <button class="back-btn" onclick="window.location.href='/quiz/index.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back
            </button>
            <h1 class="neon-text">Kennzeichen-Quiz (Einfach)</h1>
        </header>
        <main class="setup-container">
            <div class="setup-card">
                <div class="setup-section">
                    <h2>Kontinente</h2>
                    <div class="country-grid">
                        <button class="country-btn active" data-continent="EU">
                            <span class="flag">🌍</span> Europa
                        </button>
                        <button class="country-btn active" data-continent="AS">
                            <span class="flag">🌏</span> Asien
                        </button>
                        <button class="country-btn active" data-continent="AF">
                            <span class="flag">🌍</span> Afrika
                        </button>
                        <button class="country-btn active" data-continent="NA">
                            <span class="flag">🌎</span> Nordamerika
                        </button>
                        <button class="country-btn active" data-continent="SA">
                            <span class="flag">🌎</span> Südamerika
                        </button>
                        <button class="country-btn active" data-continent="OC">
                            <span class="flag">🌏</span> Ozeanien
                        </button>
                    </div>
                    <p class="country-hint">Nichts ausgewählt = alle Kontinente</p>
                </div>
                <div class="setup-section">
                    <h2>Anzahl der Fragen</h2>
                    <div class="options-grid">
                        <button class="option-btn active" data-questions="10">10</button>
                        <button class="option-btn" data-questions="20">20</button>
                        <button class="option-btn" data-questions="30">30</button>
                        <button class="option-btn" data-questions="50">50</button>
                    </div>
                    <p class="region-count-hint" id="region-count-hint"></p>
                </div>
                <button class="start-btn" onclick="startQuiz()">
                    Quiz starten
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
            </div>
        </main>
    </div>
    <script>
        var CONTINENT_LIST = ['EU', 'AS', 'AF', 'NA', 'SA', 'OC'];
        var selectedQuestions = 10;

        var continentButtons = document.querySelectorAll('.country-btn[data-continent]');
        var questionButtons  = document.querySelectorAll('.option-btn[data-questions]');

        continentButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (btn.classList.contains('active')) {
                    var otherActive = Array.from(continentButtons).some(function (b) {
                        return b !== btn && b.classList.contains('active');
                    });
                    if (otherActive) {
                        btn.classList.remove('active');
                    } else {
                        // letzter aktiver Kontinent wird abgewählt -> alle aktiv (= alle Kontinente)
                        continentButtons.forEach(function (b) { b.classList.add('active'); });
                    }
                } else {
                    btn.classList.add('active');
                }
                updateHint();
            });
        });

        questionButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                questionButtons.forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                selectedQuestions = parseInt(btn.dataset.questions, 10);
                updateHint();
            });
        });

        function activeContinentList() {
            var active = Array.from(continentButtons)
                .filter(function (b) { return b.classList.contains('active'); })
                .map(function (b) { return b.dataset.continent; });
            return active.length ? active : CONTINENT_LIST.slice();
        }

        function updateHint() {
            var n = activeContinentList().length;
            document.getElementById('region-count-hint').textContent =
                n + (n === 1 ? ' Kontinent' : ' Kontinente') + ' · ' +
                selectedQuestions + (selectedQuestions === 1 ? ' Frage' : ' Fragen');
        }

        updateHint();

        function startQuiz() {
            // Aktuell gewählte Anzahl direkt aus dem aktiven Button lesen (nicht nur aus der Variable)
            var activeQ = document.querySelector('.option-btn[data-questions].active');
            var q = activeQ ? parseInt(activeQ.dataset.questions, 10) : selectedQuestions;
            sessionStorage.setItem('plateQuizQuestions', String(q));
            sessionStorage.setItem('plateQuizContinents', activeContinentList().join(','));
            window.location.href = 'kennzeichen-quiz-easy.html';
        }
    </script>
</body>
</html>
