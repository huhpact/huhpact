<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wunschliste</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="header">
      <div class="header__row">
        <h1 class="header__title">Wunschliste</h1>
        <span class="header__count" id="count"></span>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Nach Wunschgrad filtern"></div>
    </header>

    <main>
      <section class="grid" id="grid" aria-live="polite"></section>
      <p class="empty" id="empty" hidden></p>
    </main>

  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="star" viewBox="0 0 20 20">
        <path d="M10 1.5l2.47 5.18 5.65.62-4.2 3.98 1.13 5.6L10 13.9l-5.05 2.98 1.13-5.6-4.2-3.98 5.65-.62L10 1.5z"/>
      </symbol>
      <symbol id="arrow" viewBox="0 0 20 20">
        <path d="M6 14L14 6M7.5 6H14v6.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <script src="wishes.js"></script>
  <script src="app.js"></script>
</body>
</html>
